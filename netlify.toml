[build]
  command = "cd billomat/frontend && npm install && npm run build"
  publish = "billomat/frontend/dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Billomat-Proxy für Google Apps Script (Cloudflare blockt Google-IPs, s. netlify/functions/billomat-proxy.js)
[[redirects]]
  from = "/billomat-api/*"
  to = "/.netlify/functions/billomat-proxy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
