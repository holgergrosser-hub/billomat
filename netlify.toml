[build]
  command = "cd billomat/frontend && npm install && npm run build"
  publish = "billomat/frontend/dist"

[functions]
  directory = "netlify/functions"

# Täglicher Abgleich Billomat → Supabase (04:20 UTC = 05:20/06:20 deutsche Zeit, vor dem Mahnlauf).
# Manuell: /.netlify/functions/billomat-sync-now mit x-admin-token.
[functions."billomat-sync"]
  schedule = "20 4 * * *"

[build.environment]
  NODE_VERSION = "18"

# Billomat-Proxy für Google Apps Script (Cloudflare blockt Google-IPs, s. netlify/functions/billomat-proxy.js)
[[redirects]]
  from = "/billomat-api/*"
  to = "/.netlify/functions/billomat-proxy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
